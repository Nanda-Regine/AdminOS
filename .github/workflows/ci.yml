# AdminOS CI — Phase 1(a) of BUILD_JOURNEY_ADMINOS.md Session 16b.
#
# Every push and PR must: type-check, pass the unit + route-harness tests, and
# not make any quality score worse than scripts/quality-baseline.json (the
# ratchet: scores may only improve; lock improvements in with
# `node scripts/quality-scan.cjs --write-baseline`).
#
# Needs no secrets — nothing here talks to Supabase, Redis or Anthropic.

name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      # next-env.d.ts is gitignored and generated by `next dev/build`; tsc
      # needs its type references (CSS modules, images). Omit the
      # .next/types/routes.d.ts import — that only exists after a build.
      - name: Generate next-env.d.ts
        run: |
          printf '/// <reference types="next" />\n/// <reference types="next/image-types/global" />\n' > next-env.d.ts

      - name: Type-check
        run: npx tsc --noEmit

      - name: Tests
        run: npm test

      - name: Quality ratchet
        run: node scripts/quality-scan.cjs --check
