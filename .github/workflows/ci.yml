# AdminOS CI — Phase 1(a) of BUILD_JOURNEY_ADMINOS.md Session 16b.
#
# Every push and PR must: type-check, pass the unit + route-harness tests, and
# not make any quality score worse than scripts/quality-baseline.json (the
# ratchet: scores may only improve; lock improvements in with
# `node scripts/quality-scan.cjs --write-baseline`).
#
# Needs no secrets — nothing here talks to Supabase, Redis or Anthropic.

name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      # Generates next-env.d.ts and .next/types (route types + Next's route
      # export validator), which tsconfig includes. Plain tsc without this
      # misses invalid route-handler signatures that then fail `next build`
      # on Vercel (2c798d1 did exactly that).
      - name: Generate Next types
        run: npx next typegen

      - name: Type-check
        run: npx tsc --noEmit

      - name: Tests
        run: npm test

      - name: Quality ratchet
        run: node scripts/quality-scan.cjs --check

  # The Expo staff/owner app (expo-app/). Type-check plus a full Android JS
  # bundle — the bundle catches unresolvable imports and Babel/NativeWind
  # errors that tsc can't, i.e. what would otherwise fail an EAS build.
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: expo-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: expo-app/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Type-check
        run: npx tsc --noEmit

      - name: Android bundle
        env:
          # Public placeholders — the bundle only needs them to exist.
          EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
          CI: '1'
        run: npx expo export --platform android --output-dir dist
